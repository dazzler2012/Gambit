name: Gambit CI

# Every push, any branch, and on demand: unit tests, the i18n literal check, lint, and a debug APK to
# download. android.yml only runs for main and v* tags, so without this a family-build or feature
# branch gets no build at all. One optional secret, GAMBIT_DEBUG_KEYSTORE_BASE64: the owner's debug
# key, so CI APKs update a local install.
#
# The i18n check is the Gradle task verifyI18nLiterals. app/build.gradle.kts hangs it on preBuild, so it
# already runs inside the unit-test step below (and is UP-TO-DATE for the assemble after it). It is not
# run as a step of its own. It skips with only a warning when no Python is found, hence setup-python.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Trakt Client ID for BuildConfig (empty when the secret is missing: the app then hides Trakt).
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25)

      - name: Set up Python (for verifyI18nLiterals)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      # Caches the Gradle wrapper, dependencies and build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Gambit: sign debug APKs with the owner's own debug key (the one on their PC), so a CI APK installs
      # over a local build and keeps its data. Without the secret the runner makes its own key, as before.
      - name: Use the shared debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.GAMBIT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::No GAMBIT_DEBUG_KEYSTORE_BASE64 secret: this APK gets the runner's own debug key."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "GAMBIT_DEBUG_KEY=1" >> "$GITHUB_ENV"

      # The app has two ABI flavors, so there is no plain testDebugUnitTest task. standard+debug is the
      # variant the JVM tests are written against (as in android.yml).
      - name: Unit tests (runs verifyI18nLiterals via preBuild)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStandardDebugUnitTest --stacktrace

      # Same lint gate as android.yml's check job (abortOnError), so a feature branch fails here
      # instead of only after it lands on main.
      - name: Lint
        run: ./gradlew :app:lintStandardDebug --stacktrace

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Check the debug APK's signer
        if: env.GAMBIT_DEBUG_KEY == '1'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/standard/debug/*.apk | tee "$RUNNER_TEMP/signer.txt"
          grep -qi "SHA-256 digest: 73cc1a4947812527509bd8c6397247c18ff42f1a9ca3c2dcb3aa93e7f8c25bab" "$RUNNER_TEMP/signer.txt"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          # standard = arm64-v8a + armeabi-v7a, the one for a real TV box. x86_64 is emulator-only.
          name: gambit-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
