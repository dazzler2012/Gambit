name: Gambit CI

# Every push, any branch, and on demand: unit tests, the i18n literal check, and a debug APK to
# download. android.yml only runs for main and v* tags, so without this a family-build or feature
# branch gets no build at all. No secrets: the debug APK is debug-signed.
#
# The i18n check is the Gradle task verifyI18nLiterals. app/build.gradle.kts hangs it on preBuild, so it
# already runs inside the unit-test step below (and is UP-TO-DATE for the assemble after it). It is not
# run as a step of its own. It skips with only a warning when no Python is found, hence setup-python.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Python (for verifyI18nLiterals)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      # Caches the Gradle wrapper, dependencies and build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The app has two ABI flavors, so there is no plain testDebugUnitTest task. standard+debug is the
      # variant the JVM tests are written against (as in android.yml).
      - name: Unit tests (runs verifyI18nLiterals via preBuild)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStandardDebugUnitTest --stacktrace

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          # standard = arm64-v8a + armeabi-v7a, the one for a real TV box. x86_64 is emulator-only.
          name: gambit-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
